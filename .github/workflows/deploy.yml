name: Deploy Vanguard Protocol to GitHub Pages

# The live site is published from `main`. Previously Pages was configured with
# build_type "legacy" (branch + path "/"), which served the RAW repository root.
# That shipped the untranspiled source index.html, whose module bootstrap
# pointed at /src/main.tsx — a 404 on Pages, so the app never mounted and the
# page sat on the boot splash forever. This workflow builds `dist/` with Vite
# and publishes the real artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a build is never
# left half-published.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages is configured to build from this workflow
        # The site was previously published with build_type "legacy" (branch +
        # path "/"), which serves the raw repository and shipped an unbuilt
        # index.html. Switch it to the Actions source so `dist/` is what gets
        # published. Idempotent.
        #
        # This does NOT fail the job: a repository admin has to grant the
        # workflow token admin rights for this to succeed, and blocking the
        # deploy on it would freeze the site. A loud warning is emitted
        # instead, and the "Deploy after the legacy build" step below makes
        # the deployment order deterministic in the meantime.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          echo "Current Pages build_type: ${current}"
          if [ "$current" = "workflow" ]; then
            echo "Already configured for the GitHub Actions source."
            exit 0
          fi
          echo "Switching Pages build_type from '${current}' to 'workflow'…"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --jq '.build_type' || true
          after=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          echo "Pages build_type is now: ${after}"
          if [ "$after" != "workflow" ]; then
            echo "::warning title=Pages still on the legacy source::Pages is still publishing the RAW repository from main/path '/', which serves an unbuilt index.html and re-breaks the site whenever the legacy build wins the race. Fix once in Settings > Pages > Build and deployment > Source > GitHub Actions. This workflow still deploys correctly and now waits for the legacy build to finish first."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify GitHub Pages deployment layout
        # Regression guard for the exact bug that took the site down: serves
        # dist/ under a /CS2/ sub-path and checks the document, its assets and
        # their MIME types the way a browser would resolve them.
        run: npm run verify:deploy

      - name: Verify the module graph boots and mounts
        # Loads the built site in jsdom with no WebGL and no canvas, proving
        # the app mounts and selects a compatibility renderer instead of
        # showing an initialization failure.
        run: npm run verify:boot

      - name: Verify base path resolution
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('dist/index.html','utf8');
            const refs=[...html.matchAll(/(?:src|href)=\"([^\"]+)\"/g)].map(m=>m[1]).filter(u=>!u.startsWith('data:')&&!u.startsWith('#'));
            const bad=refs.filter(u=>u.startsWith('/'));
            if(bad.length){console.error('::error::absolute URLs found:',bad);process.exit(1);}
            console.log('OK: '+refs.length+' document-relative asset references.');
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for any legacy Pages build to finish
        # While Pages is still configured with build_type "legacy", GitHub runs
        # its own `pages-build-deployment` workflow from the repository root on
        # every push to main. Both publish to the same Pages site, so whichever
        # finishes last wins — and the legacy one publishes the raw source,
        # which is the outage this project is fixing.
        #
        # Waiting for it to finish first makes this workflow's deployment
        # deterministically the last write, so the site stays correct even
        # before an admin switches the source to GitHub Actions.
        if: ${{ always() && needs.build.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            running=$(gh run list --workflow "pages-build-deployment" --branch main \
              --status in_progress --json databaseId -q 'length' 2>/dev/null || echo 0)
            queued=$(gh run list --workflow "pages-build-deployment" --branch main \
              --status queued --json databaseId -q 'length' 2>/dev/null || echo 0)
            if [ "$running" = "0" ] && [ "$queued" = "0" ]; then
              echo "No legacy Pages build is in flight (attempt ${attempt}). Deploying now."
              exit 0
            fi
            echo "Legacy Pages build still running (${running} running, ${queued} queued). Waiting…"
            sleep 10
          done
          echo "::warning::A legacy Pages build was still running after 5 minutes; deploying anyway."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live site serves the built application
        # The original outage is precisely "Pages served something that is not
        # the built app". Assert the live document references a hashed bundle
        # rather than the untranspiled /src/main.tsx entry.
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 12); do
            html=$(curl -fsSL --max-time 20 "$url" 2>/dev/null || true)
            if [ -z "$html" ]; then
              echo "Attempt ${attempt}: no response yet from ${url}"
              sleep 10
              continue
            fi
            if echo "$html" | grep -qE 'src="\./assets/index-[^"]+\.js"'; then
              echo "OK: live site is serving the built application."
              echo "$html" | grep -oE '(src|href)="[^"]*"' | head -5
              exit 0
            fi
            if echo "$html" | grep -q '/src/main.tsx'; then
              echo "::error::The live site is serving the RAW SOURCE (unbuilt index.html). Pages is still configured with the legacy source. Set Settings > Pages > Build and deployment > Source to 'GitHub Actions'."
              exit 1
            fi
            echo "Attempt ${attempt}: live document did not match the expected build yet; retrying…"
            sleep 10
          done
          echo "::error::Could not confirm the live deployment at ${url}."
          exit 1
